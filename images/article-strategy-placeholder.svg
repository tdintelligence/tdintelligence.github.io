<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <rect width="960" height="600" fill="#f5f5f7"/>
  <!-- subtle grid -->
  <g stroke="#ececec" stroke-width="1">
    <line x1="0" y1="0" x2="960" y2="0"/><line x1="0" y1="40" x2="960" y2="40"/><line x1="0" y1="80" x2="960" y2="80"/>
    <line x1="0" y1="120" x2="960" y2="120"/><line x1="0" y1="160" x2="960" y2="160"/><line x1="0" y1="200" x2="960" y2="200"/>
    <line x1="0" y1="240" x2="960" y2="240"/><line x1="0" y1="280" x2="960" y2="280"/><line x1="0" y1="320" x2="960" y2="320"/>
    <line x1="0" y1="360" x2="960" y2="360"/><line x1="0" y1="400" x2="960" y2="400"/><line x1="0" y1="440" x2="960" y2="440"/>
    <line x1="0" y1="480" x2="960" y2="480"/><line x1="0" y1="520" x2="960" y2="520"/><line x1="0" y1="560" x2="960" y2="560"/>
  </g>
  <!-- roadmap line -->
  <polyline points="80,480 190,400 300,410 410,340 520,290 630,310 740,260 850,180" fill="none" stroke="#0071e3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- fill under line -->
  <polygon points="80,480 190,400 300,410 410,340 520,290 630,310 740,260 850,180 850,560 80,560" fill="#0071e322"/>
  <!-- milestone dots -->
  <circle cx="80" cy="480" r="10" fill="#0071e3" stroke="#fbfbfd" stroke-width="3"/>
  <circle cx="190" cy="400" r="10" fill="#0071e3" stroke="#fbfbfd" stroke-width="3"/>
  <circle cx="300" cy="410" r="10" fill="#0071e3" stroke="#fbfbfd" stroke-width="3"/>
  <circle cx="410" cy="340" r="10" fill="#0071e3" stroke="#fbfbfd" stroke-width="3"/>
  <circle cx="520" cy="290" r="10" fill="#0071e3" stroke="#fbfbfd" stroke-width="3"/>
  <circle cx="630" cy="310" r="10" fill="#0071e3" stroke="#fbfbfd" stroke-width="3"/>
  <circle cx="740" cy="260" r="10" fill="#0071e3" stroke="#fbfbfd" stroke-width="3"/>
  <!-- end arrow -->
  <polygon points="850,165 875,180 850,195" fill="#0071e3"/>
  <!-- labels -->
  <text x="480" y="80" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="48" font-weight="600" fill="#1d1d1f">STRATEGY</text>
  <text x="480" y="120" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="24" fill="#6e6e73">&amp; ROADMAP</text>
  <!-- badge -->
  <rect x="340" y="525" width="280" height="30" rx="15" fill="#1d1d1f"/>
  <text x="480" y="545" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" fill="#fbfbfd" font-weight="500">COMING SOON</text>
</svg>

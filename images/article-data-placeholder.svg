<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <rect width="960" height="600" fill="#f5f5f7"/>
  <!-- subtle grid -->
  <g stroke="#ececec" stroke-width="1">
    <line x1="0" y1="0" x2="960" y2="0"/><line x1="0" y1="40" x2="960" y2="40"/><line x1="0" y1="80" x2="960" y2="80"/>
    <line x1="0" y1="120" x2="960" y2="120"/><line x1="0" y1="160" x2="960" y2="160"/><line x1="0" y1="200" x2="960" y2="200"/>
    <line x1="0" y1="240" x2="960" y2="240"/><line x1="0" y1="280" x2="960" y2="280"/><line x1="0" y1="320" x2="960" y2="320"/>
    <line x1="0" y1="360" x2="960" y2="360"/><line x1="0" y1="400" x2="960" y2="400"/><line x1="0" y1="440" x2="960" y2="440"/>
    <line x1="0" y1="480" x2="960" y2="480"/><line x1="0" y1="520" x2="960" y2="520"/><line x1="0" y1="560" x2="960" y2="560"/>
  </g>
  <!-- axis -->
  <line x1="40" y1="540" x2="880" y2="540" stroke="#1d1d1f" stroke-width="2"/>
  <line x1="40" y1="60" x2="40" y2="540" stroke="#1d1d1f" stroke-width="2"/>
  <!-- bars -->
  <rect x="80" y="420" width="80" height="120" fill="#0071e3"/>
  <rect x="190" y="440" width="80" height="100" fill="#0071e3"/>
  <rect x="300" y="400" width="80" height="140" fill="#0071e3"/>
  <rect x="410" y="460" width="80" height="80" fill="#0071e3"/>
  <rect x="520" y="430" width="80" height="110" fill="#0071e3"/>
  <rect x="630" y="450" width="80" height="90" fill="#0071e3"/>
  <rect x="740" y="410" width="80" height="130" fill="#0071e3"/>
  <!-- baseline fills -->
  <rect x="80" y="540" width="80" height="60" fill="#d4d4d8"/>
  <rect x="190" y="540" width="80" height="60" fill="#d4d4d8"/>
  <rect x="300" y="540" width="80" height="60" fill="#d4d4d8"/>
  <rect x="410" y="540" width="80" height="60" fill="#d4d4d8"/>
  <rect x="520" y="540" width="80" height="60" fill="#d4d4d8"/>
  <rect x="630" y="540" width="80" height="60" fill="#d4d4d8"/>
  <rect x="740" y="540" width="80" height="60" fill="#d4d4d8"/>
  <!-- labels -->
  <text x="480" y="220" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="48" font-weight="600" fill="#1d1d1f">DATA</text>
  <text x="480" y="260" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="24" fill="#6e6e73">&amp; ANALYTICS</text>
  <!-- badge -->
  <rect x="340" y="525" width="280" height="30" rx="15" fill="#1d1d1f"/>
  <text x="480" y="545" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" fill="#fbfbfd" font-weight="500">COMING SOON</text>
</svg>
